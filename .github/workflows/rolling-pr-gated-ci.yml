name: Rolling PR Gated CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - '**.hpp'
      - '**.h'
      - '**.cpp'
      - '**.py'
      - '**.yaml'
      - '**.yml'
      - '**.rst'
      - '**.md'
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.svg'
      - '.github/workflows/rolling-pr-gated-ci.yml'
      - '**/package.xml'
      - '**/CMakeLists.txt'
      - 'ros2_control.rolling.repos'
      - 'ros2_control.lyrical.repos'
      - 'ros2_control-not-released.rolling.repos'
      - 'ros2_control-not-released.lyrical.repos'
      - 'ros_controls.rolling.repos'
      - 'ros_controls.lyrical.repos'
      - 'codecov.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-rolling:
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-pre-commit.yml@master
    with:
      ros_distro: rolling

  pre-commit-lyrical:
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-pre-commit.yml@master
    with:
      ros_distro: lyrical

  detect-docs-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.docs_changed.outputs.docs_changed }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '**.rst'
              - '**.md'
              - '**.jpg'
              - '**.jpeg'
              - '**.png'
              - '**.svg'
              - '**.yml'
              - '**.yaml'
              - '!.github/**'
              - '.github/workflows/rolling-pr-gated-ci.yml'
      - id: docs_changed
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=${{ steps.filter.outputs.docs }}" >> "$GITHUB_OUTPUT"
          fi

  check-docs:
    name: Check Docs
    needs: [detect-docs-changes]
    if: ${{ needs.detect-docs-changes.outputs.docs_changed == 'true' }}
    uses: ros-controls/control.ros.org/.github/workflows/reusable-sphinx-check-single-version.yml@rolling
    with:
      ROS2_CONTROL_PR: ${{ github.ref }}

  check-docs-noop:
    needs: [detect-docs-changes]
    if: ${{ needs.detect-docs-changes.outputs.docs_changed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "No docs changes detected. Skipping docs build."

  quality-gate:
    needs: [pre-commit-rolling, pre-commit-lyrical, check-docs, check-docs-noop]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate quality gate
        run: |
          if [[ "${{ needs.pre-commit-rolling.result }}" != "success" || "${{ needs.pre-commit-lyrical.result }}" != "success" ]]; then
            echo "Pre-commit gate failed."
            exit 1
          fi

          if [[ "${{ needs.check-docs.result }}" == "success" || "${{ needs.check-docs-noop.result }}" == "success" ]]; then
            echo "Quality gate passed."
            exit 0
          fi
          echo "Docs gate failed."
          exit 1

  semi-binary:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-industrial-ci-with-cache.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [lyrical, rolling]
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}
      ros_repo: testing
      upstream_workspace: ros2_control.${{ matrix.ROS_DISTRO }}.repos
      ref_for_scheduled_build: master

  semi-binary-clang:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-industrial-ci-with-cache.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [rolling]
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}
      ros_repo: testing
      upstream_workspace: ros2_control.${{ matrix.ROS_DISTRO }}.repos
      ref_for_scheduled_build: master
      additional_debs: clang
      c_compiler: clang
      cxx_compiler: clang++
      not_test_build: true

  build-downstream:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-industrial-ci-with-cache.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [lyrical, rolling]
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}
      ros_repo: testing
      ref_for_scheduled_build: master
      upstream_workspace: ros2_control.${{ matrix.ROS_DISTRO }}.repos
      not_test_build: true
      downstream_workspace: ros_controls.${{ matrix.ROS_DISTRO }}.repos
      not_test_downstream: false

  binary:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-industrial-ci-with-cache.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [lyrical, rolling]
        ROS_REPO: [main, testing]
        exclude:
          - ROS_DISTRO: rolling
            ROS_REPO: main
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}
      ros_repo: ${{ matrix.ROS_REPO }}
      upstream_workspace: ros2_control-not-released.${{ matrix.ROS_DISTRO }}.repos
      ref_for_scheduled_build: master

  coverage_rolling:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-build-coverage.yml@master
    secrets: inherit
    with:
      ros_distro: rolling

  compatibility-build:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-industrial-ci-with-cache.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [humble, jazzy, kilted, lyrical]
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}
      ros_repo: testing
      upstream_workspace: ros2_control.rolling.repos
      ref_for_scheduled_build: master

  abi_check:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-abi-check.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [lyrical, rolling]
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}

  debian_semi_binary_build:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-debian-build.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [lyrical, rolling]
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}
      upstream_workspace: ros2_control.${{ matrix.ROS_DISTRO }}.repos
      ref_for_scheduled_build: master
      skip_packages: rqt_controller_manager

  rhel_semi_binary_build:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-rhel-binary-build.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [lyrical, rolling]
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}
      upstream_workspace: ros2_control.${{ matrix.ROS_DISTRO }}.repos
      ref_for_scheduled_build: master
      skip_packages: rqt_controller_manager

  binary-windows:
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' }}
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-ros-tooling-win-build.yml@master
    with:
      ros_distro: rolling
      pixi_dependencies: typeguard jinja2 boost compilers cpp-expected
      upstream_workspace: ros2_control.rolling.repos
